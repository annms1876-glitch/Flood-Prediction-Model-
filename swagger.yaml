openapi: 3.0.3
info:
  title: Flood Prediction Backend API
  description: |
    Backend API for the Flood Prediction System. Provides sensor data management, 
    flood risk predictions, and alert notifications.
    
    ## Features
    - Sensor data CRUD operations
    - Real-time risk score calculation
    - Firebase authentication integration
    - Email notifications for password reset and alerts
    
    ## Authentication
    This API uses Firebase Authentication. Include the Firebase ID token in the Authorization header:
    ```
    Authorization: Bearer <firebase_id_token>
    ```
    
    Get a token using the Firebase SDK:
    ```javascript
    const token = await firebase.auth().currentUser.getIdToken();
    ```
    
    ## Rate Limiting
    - General API: 100 requests per minute
    - Authentication endpoints: 5 requests per minute
  version: 1.0.0
  contact:
    name: Flood Prediction System Team
    email: support@flood-prediction-system.com
  license:
    name: ISC
    url: https://opensource.org/licenses/ISC

servers:
  - url: http://localhost:3000
    description: Local development server
  - url: https://api.flood-prediction-system.com
    description: Production server

tags:
  - name: Health
    description: Health check endpoints
  - name: Sensors
    description: Sensor data management
  - name: Risk
    description: Flood risk calculation
  - name: Authentication
    description: Firebase authentication
  - name: Email
    description: Email notifications

paths:
  /:
    get:
      tags:
        - Health
      summary: API Health Check
      description: Returns basic API information and status
      operationId: getApiHealth
      responses:
        '200':
          description: API is running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /api:
    get:
      tags:
        - Health
      summary: API Documentation
      description: Returns API documentation with available endpoints
      operationId: getApiInfo
      responses:
        '200':
          description: API information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiInfoResponse'

  /api/health:
    get:
      tags:
        - Health
      summary: Detailed Health Check
      description: |
        Returns detailed health status including database connectivity,
        Firebase configuration, and server information.
      operationId: getDetailedHealth
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailedHealthResponse'
        '503':
          description: Service is unhealthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthErrorResponse'

  /api/readings:
    post:
      tags:
        - Sensors
      summary: Insert Sensor Reading
      description: |
        Insert a new sensor reading into the database.
        All fields except `location` are optional.
      operationId: createSensorReading
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SensorReadingInput'
            examples:
              fullReading:
                summary: Complete sensor reading
                value:
                  location: "village_a"
                  rainfall_mm: 12.5
                  water_level_m: 3.4
                  soil_moisture_percent: 65
                  tilt_degrees: 2.1
                  temperature_c: 28
                  humidity_percent: 85
              minimalReading:
                summary: Minimum required fields
                value:
                  location: "village_b"
      responses:
        '201':
          description: Sensor reading created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SensorReadingResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - firebaseAuth: []

    get:
      tags:
        - Sensors
      summary: Get Latest Sensor Readings
      description: |
        Retrieve the most recent sensor readings, ordered by timestamp descending.
        Supports pagination via the `limit` query parameter.
      operationId: getLatestReadings
      parameters:
        - name: limit
          in: query
          description: Number of readings to return (default: 100, max: 1000)
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
          example: 50
      responses:
        '200':
          description: Successful response with sensor readings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SensorReadingsListResponse'
        '400':
          description: Invalid limit parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - firebaseAuth: []

  /api/readings/{location}:
    get:
      tags:
        - Sensors
      summary: Get Readings by Location
      description: |
        Retrieve sensor readings for a specific location.
        Supports pagination via the `limit` query parameter.
      operationId: getReadingsByLocation
      parameters:
        - name: location
          in: path
          required: true
          description: Location identifier (e.g., "village_a", "sensor_001")
          schema:
            type: string
            pattern: '^[a-zA-Z0-9\\s\\-_]+$'
          example: village_a
        - name: limit
          in: query
          description: Number of readings to return (default: 100, max: 1000)
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
      responses:
        '200':
          description: Successful response with location readings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationReadingsResponse'
        '400':
          description: Invalid location or limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - firebaseAuth: []

  /api/risk:
    get:
      tags:
        - Risk
      summary: Calculate Flood Risk Score
      description: |
        Calculate flood risk score based on the latest sensor reading.
        Returns a risk score (0-100) and risk level.
        
        **Note:** This is a placeholder implementation. Replace with actual ML model integration.
      operationId: calculateRiskScore
      parameters:
        - name: location
          in: query
          description: Filter by location (optional)
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Risk score calculated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RiskScoreResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - firebaseAuth: []

components:
  securitySchemes:
    firebaseAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Firebase ID Token obtained from Firebase Authentication.
        Include in Authorization header: `Authorization: Bearer <token>`

  schemas:
    # Health Schemas
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: ok
        service:
          type: string
          example: Flood Prediction Backend
        version:
          type: string
          example: "1.0.0"
        timestamp:
          type: string
          format: date-time
        environment:
          type: string
          enum: [development, production, test]
        uptime:
          type: number
          format: float
          description: Server uptime in seconds

    ApiInfoResponse:
      type: object
      properties:
        name:
          type: string
        version:
          type: string
        description:
          type: string
        endpoints:
          type: object
          additionalProperties:
            type: object
            properties:
              method:
                type: string
                enum: [GET, POST, PUT, DELETE, PATCH]
              path:
                type: string
              description:
                type: string
        authentication:
          type: object
          properties:
            enabled:
              type: boolean
            providers:
              type: array
              items:
                type: string
        timestamps:
          type: object
          properties:
            generated:
              type: string
              format: date-time

    DetailedHealthResponse:
      type: object
      properties:
        status:
          type: string
          enum: [healthy, degraded, unhealthy]
        services:
          type: object
          properties:
            api:
              type: string
              enum: [healthy, unhealthy]
            database:
              type: string
              enum: [healthy, unhealthy, not_configured]
            firebase:
              type: string
              enum: [configured, not_configured]
        timestamp:
          type: string
          format: date-time
        uptime:
          type: number

    HealthErrorResponse:
      type: object
      properties:
        status:
          type: string
          enum: [unhealthy]
        error:
          type: string
        timestamp:
          type: string
          format: date-time

    # Sensor Schemas
    SensorReadingInput:
      type: object
      required:
        - location
      properties:
        location:
          type: string
          description: Location identifier
          pattern: '^[a-zA-Z0-9\\s\\-_]+$'
          maxLength: 100
          example: village_a
        rainfall_mm:
          type: number
          format: float
          minimum: 0
          maximum: 500
          description: Rainfall in millimeters
          example: 12.5
        water_level_m:
          type: number
          format: float
          minimum: 0
          maximum: 100
          description: Water level in meters
          example: 3.4
        soil_moisture_percent:
          type: number
          format: float
          minimum: 0
          maximum: 100
          description: Soil moisture percentage
          example: 65
        tilt_degrees:
          type: number
          format: float
          minimum: -90
          maximum: 90
          description: Sensor tilt in degrees
          example: 2.1
        temperature_c:
          type: number
          format: float
          minimum: -50
          maximum: 60
          description: Temperature in Celsius
          example: 28
        humidity_percent:
          type: number
          format: float
          minimum: 0
          maximum: 100
          description: Humidity percentage
          example: 85
        recorded_at:
          type: string
          format: date-time
          description: ISO 8601 timestamp (defaults to now if not provided)

    SensorReading:
      type: object
      properties:
        id:
          type: string
          format: uuid
        location:
          type: string
        rainfall_mm:
          type: number
          nullable: true
        water_level_m:
          type: number
          nullable: true
        soil_moisture_percent:
          type: number
          nullable: true
        tilt_degrees:
          type: number
          nullable: true
        temperature_c:
          type: number
          nullable: true
        humidity_percent:
          type: number
          nullable: true
        recorded_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time

    SensorReadingResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/SensorReading'
        message:
          type: string
        timestamp:
          type: string
          format: date-time

    SensorReadingsListResponse:
      type: object
      properties:
        success:
          type: boolean
        count:
          type: integer
        data:
          type: array
          items:
            $ref: '#/components/schemas/SensorReading'
        timestamp:
          type: string
          format: date-time

    LocationReadingsResponse:
      type: object
      properties:
        success:
          type: boolean
        location:
          type: string
        count:
          type: integer
        data:
          type: array
          items:
            $ref: '#/components/schemas/SensorReading'
        timestamp:
          type: string
          format: date-time

    # Risk Schemas
    RiskScoreResponse:
      type: object
      properties:
        risk_score:
          type: integer
          minimum: 0
          maximum: 100
          description: Flood risk score (0-100)
          example: 65
        risk_level:
          type: string
          enum: [normal, watch, warning, high, critical]
          description: Risk level classification
          example: warning
        location:
          type: string
          nullable: true
          description: Location of the reading used for calculation
        timestamp:
          type: string
          format: date-time
          description: Timestamp of the reading used
        model_version:
          type: string
          description: Version of the risk calculation model
        factors:
          type: array
          description: Contribution of each factor to the risk score
          items:
            type: object
            properties:
              factor:
                type: string
              value:
                type: number
              unit:
                type: string
              contribution:
                type: integer

    # Authentication Schemas
    AuthResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            uid:
              type: string
            email:
              type: string
            displayName:
              type: string
              nullable: true
            emailVerified:
              type: boolean
            createdAt:
              type: string
              format: date-time
            lastSignedIn:
              type: string
              format: date-time
        token:
          type: string
          description: Firebase ID token
        message:
          type: string

    UserResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            uid:
              type: string
            email:
              type: string
            displayName:
              type: string
              nullable: true
            emailVerified:
              type: boolean
            createdAt:
              type: string
              format: date-time
            lastSignedIn:
              type: string
              format: date-time
        isAuthenticated:
          type: boolean

    # Error Schemas
    ErrorResponse:
      type: object
      required:
        - success
        - error
        - code
      properties:
        success:
          type: boolean
          const: false
        error:
          type: string
          description: Human-readable error message
        code:
          type: string
          description: Error code for programmatic handling
          enum:
            - MISSING_LOCATION
            - INVALID_LIMIT
            - MISSING_FIELDS
            - INVALID_EMAIL
            - WEAK_PASSWORD
            - VALIDATION_ERROR
            - FETCH_ERROR
            - INSERT_ERROR
            - CALCULATION_ERROR
            - NOT_AUTHENTICATED
            - ALREADY_VERIFIED
            - MISSING_TOKEN
            - RATE_LIMITED
            - AUTH_RATE_LIMITED
            - INTERNAL_ERROR
        message:
          type: string
          description: Additional error details (development only)
        timestamp:
          type: string
          format: date-time

# External documentation
externalDocs:
  description: Find out more about the Flood Prediction System
  url: https://github.com/annms1876-glitch/Flood-Prediction-Model-
